<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Bouquet Maker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fce4ec, #f3e5f5, #e8eaf6, #e0f7fa);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    min-height: 100vh;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  header {
    text-align: center;
    padding: 20px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(233,30,99,0.2);
  }

  header h1 {
    font-size: 2.2em;
    background: linear-gradient(135deg, #e91e63, #9c27b0, #e91e63);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 8px;
    font-size: 1.05em;
    color: #555;
  }

  .stats-bar span { font-weight: 700; color: #e91e63; }

  .game-container {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    max-width: 1300px;
    margin: 20px auto;
    padding: 0 20px;
  }

  /* --- ORDER PANEL --- */
  .order-panel {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    border: 2px dashed #ce93d8;
    text-align: center;
  }

  .order-panel h3 { color: #7b1fa2; margin-bottom: 6px; }
  .order-panel p { color: #555; font-size: 0.95em; }
  .order-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  .order-tag {
    background: #f3e5f5;
    color: #7b1fa2;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 600;
  }
  .order-timer { font-size: 0.9em; color: #e91e63; margin-top: 6px; font-weight: 600; }

  /* --- GARDEN / SHOP --- */
  .garden-panel {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }

  .garden-panel h2 {
    text-align: center;
    color: #2e7d32;
    margin-bottom: 10px;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 14px;
  }

  .filter-btn {
    padding: 5px 14px;
    border: 2px solid #ccc;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.82em;
    font-weight: 600;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: #e91e63;
    background: #fce4ec;
    color: #e91e63;
  }

  .search-box {
    width: 100%;
    padding: 10px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 1em;
    margin-bottom: 14px;
    outline: none;
    transition: border 0.2s;
  }

  .search-box:focus { border-color: #e91e63; }

  .flower-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    max-height: 65vh;
    overflow-y: auto;
    padding: 4px;
  }

  .flower-grid::-webkit-scrollbar { width: 8px; }
  .flower-grid::-webkit-scrollbar-thumb { background: #ce93d8; border-radius: 4px; }

  .flower-card {
    background: white;
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s;
    position: relative;
    user-select: none;
  }

  .flower-card:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 6px 20px rgba(233,30,99,0.18);
    border-color: #f48fb1;
  }

  .flower-card:active { transform: scale(0.95); }

  .flower-card .emoji { font-size: 2.4em; display: block; margin-bottom: 4px; }
  .flower-card .fname { font-size: 0.72em; font-weight: 700; color: #444; line-height: 1.2; }
  .flower-card .fcolor {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-top: 4px;
    border: 1px solid #ccc;
  }

  .flower-card .rarity {
    position: absolute;
    top: 4px; right: 6px;
    font-size: 0.6em;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 700;
  }

  .rarity-common { background: #e8f5e9; color: #2e7d32; }
  .rarity-uncommon { background: #e3f2fd; color: #1565c0; }
  .rarity-rare { background: #fff3e0; color: #e65100; }
  .rarity-legendary { background: #fce4ec; color: #c62828; }

  /* --- BOUQUET PANEL --- */
  .bouquet-panel {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 20px;
    height: fit-content;
  }

  .bouquet-panel h2 { color: #c2185b; margin-bottom: 10px; }

  .bouquet-display {
    width: 320px;
    height: 360px;
    background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
    border-radius: 20px;
    border: 3px dashed #e0e0e0;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-end;
    justify-content: center;
    padding: 15px 10px 60px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }

  .bouquet-display.has-flowers { border-style: solid; border-color: #f48fb1; }

  .bouquet-display .wrap-bg {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    border-radius: 0 0 17px 17px;
    opacity: 0.5;
    transition: background 0.3s;
  }

  .bouquet-flower {
    font-size: 2em;
    margin: 2px;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
    z-index: 2;
  }

  .bouquet-flower:hover { transform: scale(1.3); }

  @keyframes popIn {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .bouquet-empty {
    color: #bbb;
    font-size: 0.95em;
    text-align: center;
    margin-top: 120px;
    z-index: 2;
  }

  .bouquet-count {
    margin: 10px 0;
    font-weight: 700;
    color: #888;
  }

  .wrap-options {
    display: flex;
    gap: 8px;
    margin: 10px 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .wrap-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid #ddd;
    cursor: pointer;
    transition: all 0.2s;
  }

  .wrap-btn:hover, .wrap-btn.active { border-color: #333; transform: scale(1.15); }

  .action-btns {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    font-size: 0.95em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  .btn:active { transform: scale(0.96); }

  .btn-submit { background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; }
  .btn-clear { background: #ffcdd2; color: #c62828; }
  .btn-new { background: #c8e6c9; color: #2e7d32; }

  /* --- RESULT MODAL --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: white;
    border-radius: 24px;
    padding: 30px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .modal h2 { color: #e91e63; margin-bottom: 10px; }
  .modal .stars { font-size: 2.5em; margin: 10px 0; }
  .modal .score-text { font-size: 1.1em; color: #555; margin-bottom: 6px; }
  .modal .tip { font-size: 0.85em; color: #999; margin-bottom: 16px; }

  /* --- TOAST --- */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333;
    color: white;
    padding: 12px 28px;
    border-radius: 12px;
    font-weight: 600;
    z-index: 200;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* --- RESPONSIVE --- */
  @media (max-width: 850px) {
    .game-container {
      grid-template-columns: 1fr;
    }
    .bouquet-panel { position: static; }
    .bouquet-display { width: 100%; max-width: 340px; }
  }
</style>
</head>

<header>
  <h1>🌸 Bouquet Maker 🌸</h1>
  <div class="stats-bar">
    <div>Score: <span id="totalScore">0</span></div>
    <div>Bouquets: <span id="bouquetsMade">0</span></div>
    <div>Best: <span id="bestScore">0</span> ⭐</div>
  </div>
</header>

<div class="game-container">
  <!-- LEFT: Garden + Order -->
  <div>
    <div class="order-panel" id="orderPanel">
      <h3>📋 Customer Order</h3>
      <p id="orderText">Loading order...</p>
      <div class="order-tags" id="orderTags"></div>
      <div class="order-timer" id="orderTimer"></div>
    </div>

    <div class="garden-panel">
      <h2>🌿 Flower Garden</h2>
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search flowers...">
      <div class="filter-bar" id="filterBar"></div>
      <div class="flower-grid" id="flowerGrid"></div>
    </div>
  </div>

  <!-- RIGHT: Bouquet -->
  <div class="bouquet-panel">
    <h2>💐 Your Bouquet</h2>
    <div class="bouquet-display" id="bouquetDisplay">
      <div class="wrap-bg" id="wrapBg"></div>
      <div class="bouquet-empty" id="bouquetEmpty">Click flowers to add them!</div>
    </div>
    <div class="bouquet-count" id="bouquetCount">0 / 15 flowers</div>

    <p style="font-size:0.85em;color:#888;margin-bottom:4px;">Wrapping Paper:</p>
    <div class="wrap-options" id="wrapOptions"></div>

    <div class="action-btns">
      <button class="btn btn-submit" onclick="submitBouquet()">🎀 Submit Bouquet</button>
      <button class="btn btn-clear" onclick="clearBouquet()">🗑️ Clear</button>
      <button class="btn btn-new" onclick="newOrder()">🔄 New Order</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Bouquet Rated!</h2>
    <div class="stars" id="modalStars"></div>
    <div class="score-text" id="modalScore"></div>
    <div class="tip" id="modalTip"></div>
    <button class="btn btn-submit" onclick="closeModal()">Next Order →</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

  { name: "Passion Flower", emoji: "🔮", color: "#7b1fa2", category: "Tropical", rarity: "rare", tags: ["exotic","purple","unique"] },

  { name: "Ginger Lily", emoji: "🧡", color: "#ff6f00", category: "Tropical", rarity: "rare", tags: ["tropical","orange","fragrant"] },

const WRAP_COLORS = [
  { name: "Kraft", color: "#d7ccc8" },
  { name: "Pink", color: "#f8bbd0" },
  { name: "Lavender", color: "#d1c4e9" },
  { name: "Mint", color: "#b2dfdb" },
  { name: "Sky", color: "#bbdefb" },
  { name: "Cream", color: "#fff8e1" },
  { name: "Red", color: "#ef9a9a" },
  { name: "Black", color: "#424242" },
  { name: "Gold", color: "#ffe082" },
  { name: "Sage", color: "#c5e1a5" },
];

const ORDER_TEMPLATES = [
  { text: "A romantic bouquet for my anniversary!", wantTags: ["romantic"], wantColors: ["red","pink"], bonus: "elegant" },
  { text: "Something bright and cheerful for a birthday!", wantTags: ["cheerful"], wantColors: ["yellow","orange"], bonus: "bright" },
  { text: "An elegant white arrangement for a wedding.", wantTags: ["elegant","wedding"], wantColors: ["white"], bonus: "classic" },
  { text: "I want something exotic and unique!", wantTags: ["exotic","tropical"], wantColors: ["orange","purple"], bonus: "rare" },
  { text: "A calming lavender-themed bouquet please.", wantTags: ["calming","fragrant"], wantColors: ["purple"], bonus: "purple" },
  { text: "Spring vibes! Pastels and fresh flowers!", wantTags: ["spring","delicate"], wantColors: ["pink","yellow"], bonus: "pink" },
  { text: "Something bold and dramatic.", wantTags: ["bold","dramatic"], wantColors: ["red","dark"], bonus: "red" },
  { text: "A gothic dark bouquet for Halloween!", wantTags: ["gothic","dark"], wantColors: ["dark"], bonus: "dark" },
  { text: "Tropical paradise vibes!", wantTags: ["tropical"], wantColors: ["orange","red"], bonus: "exotic" },
  { text: "A classic bouquet, nothing too fancy.", wantTags: ["classic"], wantColors: ["red","white","pink"], bonus: "common" },
  { text: "Something blue and dreamy.", wantTags: ["rare","delicate"], wantColors: ["blue"], bonus: "blue" },
  { text: "A boho-chic arrangement with neutrals.", wantTags: ["boho","neutral"], wantColors: ["white"], bonus: "filler" },
  { text: "I want the rarest flowers you have!", wantTags: ["rare","unique"], wantColors: [], bonus: "legendary" },
  { text: "A fragrant garden bouquet!", wantTags: ["fragrant"], wantColors: ["pink","white","purple"], bonus: "fragrant" },
  { text: "Something for Mother's Day, pink and lovely!", wantTags: ["romantic","soft"], wantColors: ["pink"], bonus: "pink" },
];

// ===================== GAME STATE =====================
let bouquet = [];
let currentOrder = null;
let totalScore = 0;
let bouquetsMade = 0;
let bestScore = 0;
let selectedWrap = WRAP_COLORS[0].color;
let activeFilter = "All";

// ===================== INIT =====================
function init() {
  buildFilters();
  buildWrapOptions();
  renderFlowers();
  newOrder();
}

function buildFilters() {
  const cats = ["All", ...new Set(FLOWERS.map(f => f.category))];
  const bar = document.getElementById("filterBar");
  bar.innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === 'All' ? 'active' : ''}" onclick="setFilter('${c}', this)">${c}</button>`
  ).join("");
}

function buildWrapOptions() {
  const container = document.getElementById("wrapOptions");
  container.innerHTML = WRAP_COLORS.map((w, i) =>
    `<div class="wrap-btn ${i === 0 ? 'active' : ''}" style="background:${w.color}" title="${w.name}" onclick="setWrap('${w.color}', this)"></div>`
  ).join("");
  document.getElementById("wrapBg").style.background = selectedWrap;
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderFlowers();
}

function setWrap(color, btn) {
  selectedWrap = color;
  document.querySelectorAll(".wrap-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("wrapBg").style.background = color;
}

// ===================== RENDER FLOWERS =====================
function renderFlowers() {
  const search = document.getElementById("searchBox").value.toLowerCase();
  const grid = document.getElementById("flowerGrid");

  let filtered = FLOWERS.filter(f => {
    const matchCat = activeFilter === "All" || f.category === activeFilter;
    const matchSearch = f.name.toLowerCase().includes(search) || f.tags.some(t => t.includes(search));
    return matchCat && matchSearch;
  });

  grid.innerHTML = filtered.map((f, i) => {
    const realIdx = FLOWERS.indexOf(f);
    return `
      <div class="flower-card" onclick="addFlower(${realIdx})" title="${f.name} (${f.rarity})">
        <span class="rarity rarity-${f.rarity}">${f.rarity}</span>
        <span class="emoji">${f.emoji}</span>
        <div class="fname">${f.name}</div>
        <span class="fcolor" style="background:${f.color}"></span>
      </div>
    `;
  }).join("");
}

document.getElementById("searchBox").addEventListener("input", renderFlowers);

// ===================== BOUQUET MANAGEMENT =====================
function addFlower(idx) {
  if (bouquet.length >= 15) {
    showToast("Bouquet is full! (max 15)");
    return;
  }
  bouquet.push(idx);
  renderBouquet();
  showToast(`Added ${FLOWERS[idx].name}!`);
}

function removeFlower(bIdx) {
  bouquet.splice(bIdx, 1);
  renderBouquet();
}

function clearBouquet() {
  bouquet = [];
  renderBouquet();
  showToast("Bouquet cleared!");
}

function renderBouquet() {
  const display = document.getElementById("bouquetDisplay");
  const empty = document.getElementById("bouquetEmpty");
  const count = document.getElementById("bouquetCount");

  // Remove old flowers
  display.querySelectorAll(".bouquet-flower").forEach(el => el.remove());

  if (bouquet.length === 0) {
    empty.style.display = "block";
    display.classList.remove("has-flowers");
  } else {
    empty.style.display = "none";
    display.classList.add("has-flowers");
    bouquet.forEach((fIdx, i) => {
      const f = FLOWERS[fIdx];
      const el = document.createElement("div");
      el.className = "bouquet-flower";
      el.textContent = f.emoji;
      el.title = `${f.name} (click to remove)`;
      el.onclick = (e) => { e.stopPropagation(); removeFlower(i); };
      display.appendChild(el);
    });
  }

  count.textContent = `${bouquet.length} / 15 flowers`;
}

// ===================== ORDERS =====================
function newOrder() {
  currentOrder = ORDER_TEMPLATES[Math.floor(Math.random() * ORDER_TEMPLATES.length)];
  document.getElementById("orderText").textContent = `"${currentOrder.text}"`;

  const tagsEl = document.getElementById("orderTags");
  const allTags = [...currentOrder.wantTags, ...currentOrder.wantColors];
  tagsEl.innerHTML = allTags.map(t => `<span class="order-tag">${t}</span>`).join("");

  document.getElementById("orderTimer").textContent = "";
}

// ===================== SCORING =====================
function submitBouquet() {
  if (bouquet.length === 0) {
    showToast("Add some flowers first!");
    return;
  }

  let score = 0;
  let maxScore = 100;
  let feedback = [];

  // 1. Size bonus (more flowers = better, up to a point)
  const sizeScore = Math.min(bouquet.length * 5, 30);
  score += sizeScore;
  if (bouquet.length < 5) feedback.push("Could use more flowers");
  else if (bouquet.length >= 10) feedback.push("Great fullness!");

  // 2. Variety bonus
  const uniqueFlowers = new Set(bouquet).size;
  const varietyScore = Math.min(uniqueFlowers * 3, 20);
  score += varietyScore;
  if (uniqueFlowers >= 6) feedback.push("Wonderful variety!");

  // 3. Order matching - tags
  if (currentOrder) {
    let tagMatches = 0;
    const wantedTags = [...currentOrder.wantTags, ...currentOrder.wantColors];
    bouquet.forEach(fIdx => {
      const f = FLOWERS[fIdx];
      wantedTags.forEach(wt => {
        if (f.tags.includes(wt)) tagMatches++;
      });
    });
    const tagScore = Math.min(tagMatches * 4, 30);
    score += tagScore;
    if (tagMatches > 5) feedback.push("Perfect match for the order!");
    else if (tagMatches > 0) feedback.push("Some flowers match the order");
    else feedback.push("Didn't quite match the order...");

    // 4. Rarity bonus
    let rarityScore = 0;
    bouquet.forEach(fIdx => {
      const r = FLOWERS[fIdx].rarity;
      if (r === "uncommon") rarityScore += 2;
      if (r === "rare") rarityScore += 4;
      if (r === "legendary") rarityScore += 8;
    });
    score += Math.min(rarityScore, 20);
    if (rarityScore > 10) feedback.push("Amazing rare flowers!");
  }

  // 5. Color harmony bonus
  const colors = bouquet.map(i => FLOWERS[i].color);
  const uniqueColors = new Set(colors).size;
  if (uniqueColors <= 3 && bouquet.length >= 5) {
    score += 10;
    feedback.push("Beautiful color harmony!");
  }

  score = Math.min(score, maxScore);
  const stars = score >= 90 ? 5 : score >= 70 ? 4 : score >= 50 ? 3 : score >= 30 ? 2 : 1;

  totalScore += score;
  bouquetsMade++;
  if (score > bestScore) bestScore = score;

  document.getElementById("totalScore").textContent = totalScore;
  document.getElementById("bouquetsMade").textContent = bouquetsMade;
  document.getElementById("bestScore").textContent = bestScore;

  // Show modal
  document.getElementById("modalStars").textContent = "⭐".repeat(stars) + "☆".repeat(5 - stars);
  document.getElementById("modalScore").textContent = `Score: ${score} / ${maxScore}`;
  document.getElementById("modalTip").textContent = feedback.join(" • ");
  document.getElementById("modal").classList.add("show");

  bouquet = [];
  renderBouquet();
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
  newOrder();
}

// ===================== TOAST =====================
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ===================== START =====================
init();
</script>
